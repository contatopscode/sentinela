name: Sentinela review
description: Run local Python QA, security, and performance analysis on a pull request.
inputs:
  run-tests:
    description: Explicitly run tests from the reviewed repository.
    required: false
    default: "false"
  audit-dependencies:
    description: Explicitly allow pip-audit to access the network.
    required: false
    default: "false"
  post-comment:
    description: Post the Markdown report as a pull request comment.
    required: false
    default: "true"
outputs:
  report:
    description: Markdown report generated by Sentinela.
    value: ${{ steps.review.outputs.report }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Sentinela
      shell: bash
      run: python -m pip install --no-input "${{ github.action_path }}[analysis]"
    - name: Review repository
      id: review
      shell: bash
      env:
        SENTINELA_RUN_TESTS: ${{ inputs.run-tests }}
        SENTINELA_AUDIT_DEPENDENCIES: ${{ inputs.audit-dependencies }}
      run: |
        args=(review "$GITHUB_WORKSPACE" --format markdown)
        if [[ "$SENTINELA_RUN_TESTS" == "true" ]]; then
          args+=(--run-tests)
        fi
        if [[ "$SENTINELA_AUDIT_DEPENDENCIES" == "true" ]]; then
          args+=(--network-pip-audit)
        fi
        report_file="$RUNNER_TEMP/sentinela-report.md"
        sentinela "${args[@]}" > "$report_file"
        cat "$report_file" >> "$GITHUB_STEP_SUMMARY"
        delimiter="SENTINELA_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
        {
          printf 'report<<%s\n' "$delimiter"
          cat "$report_file"
          printf '%s\n' "$delimiter"
        } >> "$GITHUB_OUTPUT"
    - name: Comment on pull request
      if: inputs.post-comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v9
      env:
        SENTINELA_REPORT: ${{ steps.review.outputs.report }}
      with:
        script: |
          // Um único comentário por PR, atualizado a cada execução.
          const marker = '<!-- sentinela-report -->';
          const body = `${marker}\n${process.env.SENTINELA_REPORT}`;
          const target = {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          };
          try {
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...target,
              per_page: 100,
            });
            const previous = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: target.owner,
                repo: target.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ ...target, body });
            }
          } catch (error) {
            // PRs de forks recebem token somente leitura; o relatório segue no job summary.
            if (error.status !== 403) {
              throw error;
            }
            core.warning(`Sentinela não publicou o comentário: ${error.message}`);
          }
