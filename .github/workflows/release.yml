name: Release

# Publica no PyPI por trusted publishing (OIDC), sem token salvo no repositório.
# Pré-requisito único: cadastrar este workflow como publisher confiável no PyPI
# e criar o environment "pypi" nas configurações do repositório.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Confere a tag com a versão do pacote
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} não corresponde à versão ${version} do pyproject.toml"
            exit 1
          fi
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publica no PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
