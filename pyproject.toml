[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinela"
version = "0.1.0"
description = "Revisão local de código com análise determinística e classificação configurável."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pscode" }]
keywords = ["code-review", "static-analysis", "security", "qa", "bandit", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.14.3,<3"]

[project.optional-dependencies]
dev = [
    "bandit>=1.9.4",
    "build>=1.6.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "PyYAML>=6.0.3",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.17.5,<0.18",
]
openai = ["openai>=3.52.0,<4"]
analysis = ["bandit>=1.9.4", "pip-audit>=2.10.1", "pytest>=9.2.0", "pytest-cov>=7.1.0", "radon>=6.0.1"]

[project.urls]
Homepage = "https://github.com/contatopscode/sentinela"
Issues = "https://github.com/contatopscode/sentinela/issues"
Changelog = "https://github.com/contatopscode/sentinela/blob/main/CHANGELOG.md"

[project.scripts]
sentinela = "sentinela.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinela = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["sentinela"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
