[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinela"
version = "0.1.0"
description = "Revisão local de código com análise determinística e classificação configurável."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["bandit>=1.7", "mypy>=1.10", "pip-audit>=2.7", "PyYAML>=6", "pytest>=8", "pytest-cov>=5", "radon>=6", "ruff>=0.6"]
openai = ["openai>=1.66,<4"]
analysis = ["bandit>=1.7", "pip-audit>=2.7", "pytest>=8", "pytest-cov>=5", "radon>=6"]

[project.scripts]
sentinela = "sentinela.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
